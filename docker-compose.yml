version: "3.8"

name: deo-crm

services:
  postgres:
    image: postgres:16-alpine
    container_name: deo-crm-postgres
    restart: unless-stopped
    volumes:
      - ./docker/volumes/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: deo_crm
      POSTGRES_USER: deo_crm_user
      POSTGRES_PASSWORD: deo_crm_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deo_crm_user -d deo_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deo-crm-redis
    restart: unless-stopped
    volumes:
      - ./docker/volumes/redis:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: deo-crm-minio
    restart: unless-stopped
    volumes:
      - ./docker/volumes/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: deo_crm_minio
      MINIO_ROOT_PASSWORD: deo_crm_minio_pass
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: deo-crm-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites:/etc/nginx/sites:ro
      - ./backend/staticfiles:/static:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    profiles:
      - full

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deo-crm-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./docker/volumes/backend-media:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,deo-crm-backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      DATABASE_URL: postgres://deo_crm_user:deo_crm_pass@postgres:5432/deo_crm
      POSTGRES_DB: deo_crm
      POSTGRES_USER: deo_crm_user
      POSTGRES_PASSWORD: deo_crm_pass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: deo_crm_minio
      AWS_SECRET_ACCESS_KEY: deo_crm_minio_pass
      AWS_STORAGE_BUCKET_NAME: deo-crm-files
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deo-crm-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    profiles:
      - full
