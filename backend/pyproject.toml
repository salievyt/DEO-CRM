[project]
name = "deo-crm-backend"
version = "0.1.0"
description = "DEO STUDIO CRM — Backend API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "dj-database-url>=2.2,<2.3",
    "djangorestframework>=3.15,<3.16",
    "django-cors-headers>=4.3,<4.4",
    "django-filter>=24.2,<24.3",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "django-otp>=1.5,<1.6",
    "qrcode>=7.4,<8.0",
    "django-auditlog>=3.0,<3.1",
    "django-ratelimit>=4.1,<4.2",
    "django-jazzmin>=3.0,<3.1",
    "channels>=4.1,<4.2",
    "channels-redis>=4.2,<4.3",
    "daphne>=4.1,<4.2",
    "psycopg2-binary>=2.9,<2.10",
    "redis>=5.1,<5.2",
    "django-redis>=5.4,<5.5",
    "celery>=5.4,<5.5",
    "boto3>=1.34,<1.35",
    "django-storages>=1.14,<1.15",
    "python-dotenv>=1.0,<1.1",
    "pydantic>=2.7,<2.8",
    "pydantic-settings>=2.3,<2.4",
    "drf-spectacular>=0.27,<0.28",
    "gunicorn>=22.0,<22.1",
    "pillow>=10.3,<10.4",
    "python-magic>=0.4,<0.5",
    "django-celery-beat>=2.7,<2.8",
    "aiogram>=3.13,<3.14",
    "firebase-admin>=6.5,<6.6",
    "reportlab>=4.2,<4.4",
    "requests>=2.31,<2.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<8.3",
    "pytest-django>=4.8,<4.9",
    "pytest-cov>=5.0,<5.1",
    "factory-boy>=3.3,<3.4",
    "black>=24.4,<24.5",
    "isort>=5.13,<5.14",
    "flake8>=7.1,<7.2",
    "ipython>=8.25,<8.26",
    "django-extensions>=3.2,<3.3",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line-length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["apps"]

[tool.vercel.scripts]
# Vercel runs this after dependencies are installed and before the deployment
# goes live, so production schema changes ship together with the code that
# needs them. `collectstatic` is executed by Vercel automatically and must not
# be duplicated here.
build = "python manage.py migrate --noinput --settings=config.settings.production"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "common*", "config*"]
