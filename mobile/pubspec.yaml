name: deo_crm_mobile
description: "DEO STUDIO CRM - Mobile client for CRM system"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_native_splash: ^2.4.0
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.2.7
  
  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.1
  
  # Data classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  
  # Utils
  intl: ^0.20.2
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  
  # Auth
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  
  # Charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
